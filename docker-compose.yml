services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: tinhdev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tinhdev
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tinhdev_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinhdev -d tinhdev_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Backend (Node.js + Express + TS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tinhdev_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://tinhdev:123456@postgres:5432/tinhdev_shop?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
